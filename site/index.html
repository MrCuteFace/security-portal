<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>התחברות - פורטל ביטחון</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="assets/css/site.css" />
    <link rel="stylesheet" href="demo/demo.css" />
</head>
<body>
    <div class="container">
        <div class="login-wrap">
            <div class="card login-card">
                <div class="login-card__stripe"></div>
                <div class="card-body p-4 text-center">
                    <img src="assets/images/logo.png" alt="" class="login-logo" />
                    <h3 class="mb-4">פורטל ביטחון</h3>


                    <form method="post" class="text-start" action="#" data-demo-action="app:/Account/Login">
                        

                        <div class="mb-3">
                            <label class="form-label" for="Username">&#x5E9;&#x5DD; &#x5DE;&#x5E9;&#x5EA;&#x5DE;&#x5E9;</label>
                            <input class="form-control" autofocus type="text" data-val="true" data-val-required="&#x5D9;&#x5E9; &#x5DC;&#x5D4;&#x5D6;&#x5D9;&#x5DF; &#x5E9;&#x5DD; &#x5DE;&#x5E9;&#x5EA;&#x5DE;&#x5E9;" id="Username" name="Username" value="" />
                            <span class="text-danger field-validation-valid" data-valmsg-for="Username" data-valmsg-replace="true"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="Password">&#x5E1;&#x5D9;&#x5E1;&#x5DE;&#x5D4;</label>
                            <input class="form-control" type="password" data-val="true" data-val-required="&#x5D9;&#x5E9; &#x5DC;&#x5D4;&#x5D6;&#x5D9;&#x5DF; &#x5E1;&#x5D9;&#x5E1;&#x5DE;&#x5D4;" id="Password" name="Password" />
                            <span class="text-danger field-validation-valid" data-valmsg-for="Password" data-valmsg-replace="true"></span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">התחברות</button>
                    <input name="__RequestVerificationToken" type="hidden" value="demo" /></form>
                </div>
            </div>
        </div>
    </div>
    <script src="demo/sphere.js"></script>
    <script src="demo/data.js"></script>
    <script src="demo/demo.js"></script>
</body>
</html>
