<form method="get" class="row g-2 align-items-end mb-3" action="#" data-demo-action="app:/MorningReport" data-demo-target="morningreport.html">

    <p class="mb-1">

        <a class="btn btn-outline-secondary" href="pdf/morningreport-viewpdf-date-2026-10-18.pdf" download>הורדת PDF</a>
    </div>
    <div id="pdfViewerContainer" class="pdf-frame mb-3" hidden>
        <iframe id="pdfViewerFrame" title="דו&quot;ח בוקר" style="width:100%; height:80vh; border:0; display:block;"></iframe>
    </div>
    <script>
        function togglePdfViewer() {
            var container = document.getElementById('pdfViewerContainer');
            var frame = document.getElementById('pdfViewerFrame');
            var btn = document.getElementById('togglePdfBtn');
            var isHidden = container.hasAttribute('hidden');
            if (isHidden) {
                if (!frame.getAttribute('src')) {
                    frame.setAttribute('src', 'pdf/morningreport-viewpdf-date-2026-10-18.pdf');
                }
                container.removeAttribute('hidden');
                btn.textContent = 'הסתרת הדו"ח';
            } else {
                container.setAttribute('hidden', '');
                btn.textContent = 'צפייה בדו"ח';
            }
        }
    </script>
