    <script>
        (function () {
            // לוח חתימה: ציור באצבע או בעכבר. בשמירה נשלח PNG חתוך לגבולות החתימה,
            // כדי שהחתימה תמלא את המקום שלה בטופס גם אם צוירה קטנה.
            const pads = Array.from(document.querySelectorAll('.sig-pad')).map(function (wrap) {
                const canvas = wrap.querySelector('canvas');
                const ctx = canvas.getContext('2d');
                let drawing = false, empty = true, last = null;
                let box = null;

                function resize() {
                    const ratio = window.devicePixelRatio || 1;
                    const rect = canvas.getBoundingClientRect();
                    canvas.width = Math.round(rect.width * ratio);
                    canvas.height = Math.round(rect.height * ratio);
                    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
                    ctx.lineWidth = 2.2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.strokeStyle = '#1a2a6c';
                    clear();
                }

                function clear() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    empty = true;
                    box = null;
                    wrap.classList.remove('sig-pad--signed');
                }

                function point(e) {
                    const rect = canvas.getBoundingClientRect();
                    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
                }

                function grow(p) {
                    box = box
                        ? { x0: Math.min(box.x0, p.x), y0: Math.min(box.y0, p.y), x1: Math.max(box.x1, p.x), y1: Math.max(box.y1, p.y) }
                        : { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
                }

                canvas.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    canvas.setPointerCapture(e.pointerId);
                    drawing = true;
                    last = point(e);
                    grow(last);
                    ctx.beginPath();
                    ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
                    ctx.fillStyle = ctx.strokeStyle;
                    ctx.fill();
                    empty = false;
                    wrap.classList.add('sig-pad--signed');
                });
                canvas.addEventListener('pointermove', function (e) {
                    if (!drawing) return;
                    const p = point(e);
                    ctx.beginPath();
                    ctx.moveTo(last.x, last.y);
                    ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                    last = p;
                    grow(p);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (name) {
                    canvas.addEventListener(name, function () { drawing = false; });
                });
                wrap.querySelector('.sig-pad__clear').addEventListener('click', clear);

                function toPng() {
                    if (empty || !box) return '';
                    const ratio = canvas.width / canvas.getBoundingClientRect().width;
                    const pad = 4;
                    const x = Math.max(0, Math.floor((box.x0 - pad) * ratio));
                    const y = Math.max(0, Math.floor((box.y0 - pad) * ratio));
                    const w = Math.min(canvas.width - x, Math.ceil((box.x1 - box.x0 + pad * 2) * ratio));
                    const h = Math.min(canvas.height - y, Math.ceil((box.y1 - box.y0 + pad * 2) * ratio));
                    const out = document.createElement('canvas');
                    out.width = Math.max(1, w);
                    out.height = Math.max(1, h);
                    out.getContext('2d').drawImage(canvas, x, y, w, h, 0, 0, w, h);
                    return out.toDataURL('image/png');
                }

                resize();
                return {
                    wrap: wrap,
                    input: document.getElementById(wrap.dataset.target),
                    isEmpty: function () { return empty; },
                    toPng: toPng,
                    resize: resize,
                };
            });

            // סיבוב מסך משנה את גודל הלוח ומוחק אותו - עדיף על חתימה מעוותת
            let lastWidth = window.innerWidth;
            window.addEventListener('resize', function () {
                if (window.innerWidth === lastWidth) return;
                lastWidth = window.innerWidth;
                pads.forEach(function (p) { p.resize(); });
            });

            document.getElementById('certifyForm').addEventListener('submit', function (e) {
                const missing = pads.filter(function (p) { return p.isEmpty(); });
                if (missing.length > 0) {
                    e.preventDefault();
                    alert('חסרה חתימה. שני הצדדים צריכים לחתום לפני השמירה.');
                    missing[0].wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                pads.forEach(function (p) { p.input.value = p.toPng(); });
                document.getElementById('certifySaveBtn').disabled = true;
            });
        })();
    </script>
